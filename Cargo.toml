[package]
name = "rust-ft8"
version = "0.1.0"
edition = "2021"
authors = ["YES-ESP-DX Team"]
description = "A pure-Rust, highly accurate FT8 codec library matching WSJT-X and JTDX performance"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/BG5VDH/Rust-FT8"
keywords = ["ft8", "amateur-radio", "dsp", "demodulator", "wsjtx"]
categories = ["multimedia::audio", "algorithms", "science"]
exclude = [
    "reference/**",
    "jtdx/**",
    "tests/wav/**",
    "docs/*.pdf",
    "*.wav",
    "*.tar.gz",
    "build_rk.sh",
    "sync_and_test.sh",
    "*.log",
]

[dependencies]
rustfft = "6.4.1"
rayon = "1.11.0"
num-complex = "0.4.6"
regex = "1.12.3"

[lib]
name = "rust_ft8"
path = "src/lib.rs"

[[bin]]
name = "ft8_decode"
path = "src/bin/ft8_decode.rs"

[[bin]]
name = "ft8_encode"
path = "src/bin/ft8_encode.rs"

[[bin]]
name = "ft8_stream"
path = "src/bin/ft8_stream.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

